[project]
name = "ai-gaussian-splatter-worker"
version = "0.1.0"
description = "COLMAP + gsplat reconstruction pipeline, run on a GPU spot instance per job"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "pillow>=10.4",
    "torch>=2.3",
    "gsplat>=1.4",
    "plyfile>=1.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "moto[s3]>=5.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
