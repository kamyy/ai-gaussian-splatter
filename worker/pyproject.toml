[project]
name = "ai-gaussian-splatter-worker"
version = "0.1.0"
description = "COLMAP + gsplat reconstruction pipeline, run on a GPU spot instance per job"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "pillow>=10.4",
    "torch>=2.3",
    "gsplat>=1.4",
    # gsplat's cuda/_backend.py imports packaging but does not declare it, so
    # nothing else pulls it in and the first rasterization() call dies with
    # ModuleNotFoundError. Declared here on gsplat's behalf.
    "packaging>=24.0",
    "plyfile>=1.0.3",
]

# torch must come from the CUDA build matching the Docker image's nvcc, not
# from PyPI's default wheel. gsplat compiles its kernels at run time through
# torch.utils.cpp_extension, which aborts when torch's CUDA major version
# differs from the toolkit it finds: PyPI's torch ships +cu130 while the image
# is CUDA 12.9, so the default resolution fails with "The detected CUDA version
# mismatches the version that was used to compile PyTorch".
#
# This tracks the base image in worker/Dockerfile — move one and move both.
[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "moto[s3]>=5.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
