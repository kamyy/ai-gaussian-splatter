name: Deploy

# Applies infra/ and runs the migration on every push to main. It builds a new web image only when web/ changed, and it
# rolls the service out whenever an apply changes the web task definition. See ARCHITECTURE.md "Image tags" for why the
# image tag is web/'s tree id rather than the commit SHA, and "Migration ordering" for why the migration sits between
# two terraform apply calls rather than inside one. See RUNBOOK.md for the one-time OIDC role setup this job's AWS
# credentials depend on. It runs only as .github/workflows/ci.yml's deploy job, so it starts after every check job
# passes. That caller also holds the push-to-main gate and grants the id-token permission.
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploys run one at a time and queue rather than cancel each other. Two pushes close together would otherwise run
    # overlapping deploys against the same ECS service and Terraform state. At best that races two `terraform apply`
    # calls. At worst a service rollout starts before the other run's migration has finished. Terraform's state lock
    # stops concurrent applies from corrupting the state, but it doesn't stop their ECS calls racing each other.
    # cancel-in-progress is false so a deploy that has started always runs to the end instead of stopping halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      CLUSTER_NAME: ai-gaussian-splatter
      SERVICE_NAME: ai-gaussian-splatter-web
      MIGRATION_TASK_FAMILY: ai-gaussian-splatter-migrate
      ECR_REPO: ai-gaussian-splatter
      # Terraform reads TF_VAR_<name> into the matching variable automatically, so the `terraform apply` calls below
      # need no repeated `-var` flags. The two-phase deploy only overrides the web and migrate image tags per step.
      TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
      TF_VAR_clerk_secret_key_arn: ${{ vars.CLERK_SECRET_KEY_ARN }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_domain_zone_name: ${{ vars.DOMAIN_ZONE_NAME }}
      TF_VAR_worker_ami_id: ${{ vars.WORKER_AMI_ID }}
      # GPU worker deployment stays manual. This value changes only when someone builds and pushes a new worker image by
      # hand (RUNBOOK.md), not on every push to main like the web and migrate image tags.
      TF_VAR_worker_image_tag: ${{ vars.WORKER_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v7

      # This check runs first, before anything is built or deployed. The value is compiled into the browser bundle
      # (web/Dockerfile). An unset variable produces an image where every route returns 500, because clerkMiddleware()
      # rejects the empty key. That would only show up as a circuit-breaker rollback several minutes into the second
      # terraform apply below. The `pk_` check also catches a secret key pasted into this variable by mistake, which
      # would put sk_* into client-side JavaScript.
      - name: Check CLERK_PUBLISHABLE_KEY is a publishable key
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          case "$CLERK_PUBLISHABLE_KEY" in
            pk_*) ;;
            *) echo "::error::repository variable CLERK_PUBLISHABLE_KEY must be set to a pk_* key (RUNBOOK.md)"; exit 1 ;;
          esac

      # AWS_ACCOUNT_ID is interpolated into the next step's role ARN and into the state bucket name `terraform init`
      # uses below. An undefined repository variable renders as "", which fails the assume-role on a malformed ARN
      # that names nothing. Checked here so the error names the variable.
      - name: Check AWS_ACCOUNT_ID is an account id
        run: |
          if [[ ! $AWS_ACCOUNT_ID =~ ^[0-9]{12}$ ]]; then
            echo "::error::repository variable AWS_ACCOUNT_ID must be a 12-digit account id (RUNBOOK.md)"
            exit 1
          fi

      # Terraform's own validation would catch an unset DOMAIN_ZONE_NAME, but only at the first apply, after the
      # image build. Checked here so an unset variable costs seconds instead of most of a deploy.
      - name: Check DOMAIN_ZONE_NAME is a DNS zone name
        run: |
          if [[ ! $TF_VAR_domain_zone_name =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
            echo "::error::repository variable DOMAIN_ZONE_NAME must be a bare DNS zone name like example.com (RUNBOOK.md)"
            exit 1
          fi

      # AWS_REGION is read from var.aws_region's default, so the region this job signs with is the one Terraform
      # deploys, not a second copy that can drift. APP_PUBLIC_URL is https://ai-gaussian-splatter.<DOMAIN_ZONE_NAME>,
      # the same hostname local.app_hostname builds. The credential step below reads AWS_REGION too.
      - name: Resolve region and origin
        run: |
          source scripts/lib/terraform.sh
          # Assigned first: inside the echo the helpers' non-zero exits would be discarded, and the job would sign
          # with an empty region and fail several steps later naming neither this step nor infra/variables.tf.
          region=$(tf_get_aws_region)
          hostname=$(tf_get_app_hostname "$TF_VAR_domain_zone_name")
          echo "AWS_REGION=$region" >> "$GITHUB_ENV"
          echo "APP_PUBLIC_URL=https://$hostname" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-gaussian-splatter-ci-deploy
          aws-region: ${{ env.AWS_REGION }}

      # scripts/prod/set-gh-repo-variables.sh looks HOSTED_ZONE_ID up from DOMAIN_ZONE_NAME, but either variable can be
      # edited on its own afterwards. The two then name different zones, and the ACM validation record lands in a zone
      # that doesn't serve the hostname, which stalls the first apply until ACM's own validation timeout gives up.
      - name: Check HOSTED_ZONE_ID serves DOMAIN_ZONE_NAME
        run: |
          if ! zone=$(aws route53 get-hosted-zone --id "$TF_VAR_hosted_zone_id" \
            --query HostedZone.Name --output text); then
            echo "::error::repository variable HOSTED_ZONE_ID names no zone in this account (RUNBOOK.md)"
            exit 1
          fi
          if [[ ${zone%.} != "$TF_VAR_domain_zone_name" ]]; then
            echo "::error::HOSTED_ZONE_ID serves ${zone%.}, not DOMAIN_ZONE_NAME's $TF_VAR_domain_zone_name (RUNBOOK.md)"
            exit 1
          fi

      - id: terraform-version
        run: |
          source scripts/lib/terraform.sh
          version=$(tf_get_required_version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          # The wrapper adds its own lines to a command's stdout, which would corrupt the state JSON captured below.
          terraform_wrapper: false

      - name: terraform init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=ai-gaussian-splatter-tfstate-$AWS_ACCOUNT_ID" \
            -backend-config="key=infra.tfstate" \
            -backend-config="region=$AWS_REGION"

      # Discovers what's live before touching anything, so the migration-only deploy below (which must leave the service
      # alone) has a real value to pin it to. Terraform state, not an ECS lookup, decides whether this is the first
      # deploy into an empty account. A failed state read fails this step, while a failed ECS lookup could pass for "no
      # service yet" and roll the service forward before its migration ran.
      - name: Resolve tags
        working-directory: infra
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/terraform.sh"
          # web/'s git tree id, not the commit SHA, so a push that leaves web/ untouched resolves to the tag already
          # in ECR and skips the builds below.
          NEW_TAG=$(tf_get_web_image_tag)
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_ENV"
          # `state pull` prints nothing and exits 0 when the state is empty.
          STATE=$(terraform state pull)
          HAS_SERVICE=false
          if [ -n "$STATE" ]; then
            HAS_SERVICE=$(jq 'any(.resources[]; .type == "aws_ecs_service" and .name == "web")' <<<"$STATE")
          fi
          if [ "$HAS_SERVICE" = false ]; then
            # Nothing is serving yet, so there is no old image to keep the service on. With OLD_TAG equal to NEW_TAG,
            # the first apply below creates the whole stack, service included.
            echo "FIRST_DEPLOY=true" >> "$GITHUB_ENV"
            OLD_TAG=$NEW_TAG
          else
            SERVICE_JSON=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME")
            OLD_TASK_DEF=$(jq -r '.services[0].deployments[] | select(.status=="PRIMARY") | .taskDefinition' <<<"$SERVICE_JSON")
            # image is tagged "<tree>-web" (infra/web.tf appends the -web suffix); web_image_tag takes the bare tag,
            # so strip it back off.
            OLD_TAG=$(aws ecs describe-task-definition --task-definition "$OLD_TASK_DEF" \
              --query 'taskDefinition.containerDefinitions[0].image' --output text | awk -F: '{print $NF}')
            OLD_TAG=${OLD_TAG%-web}
          fi
          echo "OLD_TAG=$OLD_TAG" >> "$GITHUB_ENV"

      # The first deploy has no repository to push into yet. Only the repository is applied here, because the service
      # can't be created before the image it names has been pushed.
      - name: terraform apply — ECR repository only (first deploy)
        if: env.FIRST_DEPLOY == 'true'
        working-directory: infra
        env:
          TF_VAR_web_image_tag: ${{ env.NEW_TAG }}
        run: terraform apply -auto-approve -input=false -target=aws_ecr_repository.web -target=aws_ecr_lifecycle_policy.web

      # Each tag is skipped if it is already in the repository. A push that leaves web/ untouched therefore builds
      # nothing, and a run that failed in any step below re-runs cleanly. The repository is IMMUTABLE
      # (infra/registry.tf) and podman builds aren't bit-reproducible, so rebuilding the same tree produces a different
      # digest and would abort here with ImageTagAlreadyExists. `batch-get-image` rather than `describe-images` because
      # the CI role already grants it (scripts/prod/configure-ci-role.sh).
      - name: Build and push images
        working-directory: web
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | podman login --username AWS --password-stdin "$REGISTRY"
          # Only a clear "found" skips the build. An error or an empty reply falls through and builds, so a wrong answer
          # costs a rebuild rather than deploying a tag that was never pushed.
          pushed() {
            [ "$(aws ecr batch-get-image --repository-name "$ECR_REPO" \
              --image-ids imageTag="$1" --query 'length(images)' --output text 2>/dev/null || true)" = "1" ]
          }
          build_and_push() {
            target=$1; tag_suffix=$2; shift 2
            if pushed "${NEW_TAG}-${tag_suffix}"; then
              echo "$ECR_REPO:${NEW_TAG}-${tag_suffix} already pushed — skipping build"
            else
              podman build --target "$target" -t "$REGISTRY/$ECR_REPO:${NEW_TAG}-${tag_suffix}" "$@" .
              podman push "$REGISTRY/$ECR_REPO:${NEW_TAG}-${tag_suffix}"
            fi
          }
          build_and_push web web --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY"
          build_and_push migrator migrate

      # The two builds above are separate podman invocations, so one can be skipped or fail to push without the other
      # noticing. `terraform apply` then registers a task definition naming an image that is not there, and nothing
      # pulls the -migrate tag until `ecs run-task` does. Checked here, while the deploys below have not run yet.
      # The check also covers a pair pushed by an earlier deploy, since a run that rebuilds nothing still names both.
      - name: Verify both of this build's images are in the repository
        run: |
          FOUND=$(aws ecr batch-get-image --repository-name "$ECR_REPO" \
            --image-ids imageTag="$NEW_TAG-web" imageTag="$NEW_TAG-migrate" \
            --query 'length(images)' --output text)
          if [[ $FOUND != 2 ]]; then
            echo "::error::expected $ECR_REPO:$NEW_TAG-web and :$NEW_TAG-migrate in ECR, found $FOUND of 2"
            exit 1
          fi

      # Registers the migration task against NEW_TAG while keeping the service's own image on OLD_TAG. Terraform then
      # sees no change to the service, so no rollout starts. This is the only way to get a runnable migration task
      # definition for the new image without also moving the service forward before the migration has run. On the first
      # deploy OLD_TAG equals NEW_TAG, so this apply creates the whole stack and the service starts before its migration
      # runs. Nothing older is serving yet, so nothing breaks.
      - name: terraform apply — migration task only (service stays on OLD_TAG)
        working-directory: infra
        env:
          TF_VAR_web_image_tag: ${{ env.OLD_TAG }}
          TF_VAR_migrate_image_tag: ${{ env.NEW_TAG }}
        run: terraform apply -auto-approve -input=false

      # This step is unconditional (AGENTS.md). An unchanged tag says web/drizzle/ is unchanged, not that the database
      # matches it. The apply above can replace aws_db_instance.main. A re-run after a failed first deploy finds the
      # service already on this tag, with the migration that failed still unapplied. Re-applying migrations that
      # already ran costs one short task.
      - name: Run migration
        run: |
          # Looked up here rather than before the apply above, because on the first deploy that apply is what created
          # the service.
          aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" \
            | jq '.services[0].networkConfiguration' > network-config.json
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER_NAME" \
            --task-definition "$MIGRATION_TASK_FAMILY" --launch-type FARGATE \
            --network-configuration file://network-config.json \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER_NAME" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::migration task exited $EXIT_CODE — stopping before the roll-forward apply"
            exit 1
          fi

      # Only reached if the migration above exited 0. Now both tags match, so this apply includes the service's image
      # change. Terraform rolls it out, and deployment_circuit_breaker(rollback) protects the rollout. On the first
      # deploy, and on any deploy whose tag is unchanged, the migration-task apply already ran with these same
      # variables, so this apply changes nothing. A rollout on such a deploy happens there instead.
      - name: terraform apply — roll the service forward to NEW_TAG
        working-directory: infra
        env:
          TF_VAR_web_image_tag: ${{ env.NEW_TAG }}
          TF_VAR_migrate_image_tag: ${{ env.NEW_TAG }}
        run: terraform apply -auto-approve -input=false

      # /api/v1/healthz never touches the database (RUNBOOK.md), so it can't tell a working deploy from one that will
      # 500 on every real request. A nonexistent splat id still round-trips a real DB query: a working deploy 404s
      # ("no such row"), while a broken DB connection 500s. It waits for the rollout to settle first. On the first
      # deploy no older task answers in the meantime, so the ALB returns 503 until the new task passes health checks.
      - name: Smoke test (a real DB-backed route, not /healthz)
        run: |
          aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "$APP_PUBLIC_URL/api/v1/public/splats/00000000-0000-0000-0000-000000000000")
          if [ "$STATUS" != "404" ]; then
            echo "::error::GET /api/v1/public/splats/<id> returned $STATUS (expected 404) after deploying $NEW_TAG"
            exit 1
          fi
