name: CI

# Plan §8: unit/component tests run on every PR here. Playwright runs too,
# but its one spec is skipped pending a seeded test database, so it currently
# asserts nothing. Real-pipeline integration tests (COLMAP + gsplat on a real
# GPU) are deliberately NOT run here — they cost real time/money and stay
# manual/milestone-gated, per the plan's testing strategy.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Single Biome invocation from repo root covers both scripts/*.js
      # and web/ in one pass — Biome doesn't need web's own
      # node_modules to lint/format files, only its own binary.
      - run: pnpm biome:ci

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy pipeline
      # No GPU/CUDA toolkit in CI runners — this is exactly the CI-cheap tier (fetch/export/status callbacks, mocked
      # S3/HTTP), not the real COLMAP+gsplat pipeline. See worker/pipeline/train.py's docstring.
      - run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Structurally valid dummy key (base64 of "example.clerk.accounts.dev$"). It has to parse — clerkMiddleware()
      # rejects a malformed one outright.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_fake_for_ci
      # A pk_test_* key makes the SDK treat this as a development instance, and only the printed disclosure notice is
      # CI-aware — collection itself is not. Without this, CI runs report telemetry.
      NEXT_PUBLIC_CLERK_TELEMETRY_DISABLED: "1"
      # Inlined at build time, so `next build` here needs them to match what a real image ships — otherwise the built
      # bundle points at Clerk's hosted Account Portal rather than the app's own sign-in page.
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /dashboard
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: test
      DATABASE_USER: test
      DATABASE_PASSWORD: test
      # getEnv() validates all of these on first use, and getDb() calls it —
      # so any DB-touching page throws without them, including under the dev
      # server Playwright starts. Dummy values: presigning is local crypto and
      # nothing in CI reaches AWS.
      UPLOADS_BUCKET: test-uploads
      SPLATS_BUCKET: test-splats
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      WORKER_AMI_ID: ami-0123456789abcdef0
      WORKER_SUBNET_ID: subnet-0123456789abcdef0
      WORKER_SECURITY_GROUP_ID: sg-0123456789abcdef0
      WORKER_INSTANCE_PROFILE_ARN: arn:aws:iam::123456789012:instance-profile/worker
      APP_PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      # A manual `podman run` rather than the `services:` block the postgres:18 container used before: the migrator-
      # image test below runs its own podman container that needs to address Postgres by name, and a GitHub Actions
      # `services:` container (Docker-managed) isn't reachable that way from a sibling podman container. A dedicated
      # user-defined podman network sidesteps that rather than relying on `--network host`, which does not behave as
      # true host networking under rootless podman here — verified directly against this runner setup.
      - name: Start Postgres
        run: |
          podman network create ci-net
          podman run -d --name ci-postgres --network ci-net -p 5432:5432 \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test \
            postgres:18
          for _ in $(seq 1 30); do
            podman exec ci-postgres pg_isready -U test && break
            sleep 1
          done
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # pnpm typecheck runs `next typegen` before `tsc --noEmit` — required on a clean checkout, since CI has never run
      # `next dev`/`next build` to generate the App Router route types tsc needs. See AGENTS.md.
      - run: pnpm typecheck
      # A schema edit with no matching migration is otherwise invisible: the types come straight from schema.ts, so tsc
      # stays green while the database drifts, and it surfaces as a runtime SQL error. db:generate is a no-op when the
      # schema matches the snapshot in web/drizzle/meta/, so anything new on disk here means the migration was never
      # generated.
      - name: Check migrations are up to date with the schema
        run: |
          pnpm db:generate
          # --porcelain, not `git diff`: a new migration arrives as untracked files, which git diff does not report.
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::web/lib/server/db/schema.ts changed without a migration. Run 'pnpm db:generate' and commit web/drizzle/."
            git status --porcelain -- drizzle
            exit 1
          fi
      # Builds and runs the actual deployable migration artifact (web/Dockerfile's `migrator` stage) against this job's
      # real Postgres, rather than only testing the underlying `drizzle-kit migrate` script — the config-level CDK tests
      # in infra/tests/test_web_stack.py assert the task definition is wired correctly, but not that the image itself
      # applies a migration.
      - name: Build and run the migrator image against the CI database
        working-directory: web
        run: |
          podman build --target migrator -t migrator:ci .
          # --network ci-net, addressing Postgres by container name: see the "Start Postgres" step for why --network
          # host isn't used. No DATABASE_SSL_CA: the migrator image doesn't bake TLS on (web/Dockerfile), and this
          # database doesn't offer it — only RDS's rds.force_ssl requires TLS.
          podman run --rm --network ci-net \
            -e DATABASE_HOST=ci-postgres -e DATABASE_PORT=5432 -e DATABASE_NAME=test \
            -e DATABASE_USER=test -e DATABASE_PASSWORD=test \
            migrator:ci
      # Re-applies migrations directly (not via the container); a no-op given the step above already applied them —
      # drizzle-kit tracks applied migrations — so this mainly fails fast on a bad migration outside the container path
      # too. The server test project's globalSetup also does this, once more, for the same reason.
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      # Python checks run first and need only uv — no Node/pnpm setup cost
      # if one of them fails. Node's only needed for the `cdk` CLI
      # (npm-distributed regardless of app language — there's no
      # pip-installable substitute), so it's set up last, right before the
      # one step that actually needs it.
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app.py stacks
      - run: uv run pytest -v
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # AWS_ACCOUNT_ID is deliberately left unset here: app.py falls
      # back to the placeholder account, and this job has no AWS
      # credentials configured (it runs on every pull_request, including
      # forks) — validates templates only, never a real deploy.
      - name: cdk synth
        run: pnpm cdk:synth
