name: CI

# Unit and component tests run on every PR here. Playwright is wired up but skipped until web/e2e/ holds a spec, which
# waits on a seeded test database (AGENTS.md). Tests that run the real pipeline (COLMAP and gsplat on a real GPU) are
# deliberately not run here. They cost real time and money, so they stay manual.
on:
  pull_request:
  push:
    branches: [main]
    # A push to main whose commits touch only docs skips the whole workflow, including the deploy. The PR checks already
    # validated those commits, so running lint, build, and deploy again would be wasted work.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  # scripts/prod/worker-push-image.sh starts a run on main by hand after it changes WORKER_IMAGE_TAG, because no push
  # carries that change. A manual run on main deploys exactly like a push to main.
  workflow_dispatch:

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # One Biome run from the repo root covers both scripts/*.js and web/. Biome needs only its own binary to lint and
      # format files, not web/'s node_modules.
      - run: pnpm run biome:lint
      # Runs shellcheck, which Biome doesn't cover.
      - run: pnpm run scripts:lint

  worker:
    runs-on: ubuntu-latest
    env:
      # worker:lint and worker:test run through `uv run`, which would otherwise sync worker/.venv back to uv.lock and
      # reinstall the CUDA torch the step below leaves out.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      # uv.lock pins torch's CUDA 12.9 build, which brings several GB of nvidia-*, cuda-* and triton wheels. This runner
      # has no GPU and the tests never touch CUDA, so it installs every other locked package and the CPU build of the
      # same torch version instead. --no-deps keeps the CPU wheel from pulling the CUDA packages back in.
      # worker/Dockerfile still installs exactly what uv.lock pins.
      - name: Install worker dependencies with CPU-only torch
        working-directory: worker
        run: |
          reqs=$(uv export --locked --group dev --no-hashes)
          torch_version=$(sed -n 's/^torch==\([^+]*\)+.*/\1/p' <<<"$reqs")
          if [[ -z $torch_version ]]; then
            echo "::error::uv export listed no torch==<version>+<build> pin"
            exit 1
          fi
          uv venv
          grep -v -E '^(torch==|triton==|nvidia-|cuda-)' <<<"$reqs" > "$RUNNER_TEMP/worker-requirements.txt"
          uv pip install --no-deps -r "$RUNNER_TEMP/worker-requirements.txt"
          uv pip install --no-deps "torch==$torch_version+cpu" --index-url https://download.pytorch.org/whl/cpu
          uv pip check
      # worker:lint and worker:test (root package.json) are pure shell (`uv --directory worker run ...`). No worker
      # node_modules to install, just the pnpm CLI above to parse and run the scripts.
      - run: pnpm run worker:lint
      # CI runners have no GPU or CUDA toolkit. These are the cheap tests (fetch, export, and status callbacks against
      # mocked S3 and HTTP), not the real COLMAP and gsplat pipeline.
      - run: pnpm run worker:test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # A dummy key that is still structurally valid (the base64 of "example.clerk.accounts.dev$"). It has to parse,
      # because clerkMiddleware() rejects a malformed key outright.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_fake_for_ci
      # getEnv() validates all of these on first use, and getDb() calls getEnv(). Any page that touches the database
      # therefore throws without them, including under the dev server Playwright starts. The values are dummies:
      # presigning is local crypto, and nothing in CI reaches AWS. That dev server needs no DATABASE_*, WORKER_* or
      # APP_ORIGIN variables, because it counts as local dev (web/lib/server/env.ts's isLocalDev()). The
      # database it and `pnpm db:migrate` use is the same one local dev uses, created by "Start Postgres" below.
      UPLOADS_BUCKET: test-uploads
      SPLATS_BUCKET: test-splats
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@v7
      # Postgres starts with a plain `podman run` rather than a `services:` block. The migrator-image test below runs
      # its own podman container, which has to reach Postgres by container name. A GitHub Actions `services:` container
      # is managed by Docker, so a sibling podman container can't reach it that way. A dedicated podman network solves
      # that. `--network host` isn't used because it doesn't behave as true host networking under rootless podman on
      # this runner.
      - name: Start Postgres
        run: |
          podman network create ci-net
          podman run -d --name ci-postgres --network ci-net -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=ai_gaussian_splatter \
            postgres:18
          # Checked over TCP, because the image's temporary init server listens only on the Unix socket and a socket
          # check can report ready before the real server starts.
          deadline=$((SECONDS + 30))
          until podman exec ci-postgres pg_isready -h 127.0.0.1 -U postgres; do
            if ((SECONDS >= deadline)); then
              echo "ci-postgres did not become ready within 30s" >&2
              exit 1
            fi
            sleep 1
          done
          # The dev database above is what `pnpm db:migrate` uses, and this one is the tests' default
          # (web/vitest.config.mts), the same pair scripts/dev/db.sh creates locally.
          podman exec ci-postgres createdb -U postgres ai_gaussian_splatter_test
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Fails on any high or critical advisory against a package the server or browser ships. A new advisory therefore
      # fails a PR that changed nothing, which is the point: the fix is an upgrade, and it lands before anything else.
      # devDependencies are left out because none of them reach the container.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      # web:lint runs `next typegen` before `tsc --noEmit`. CI never runs `next dev` or `next build`, so the App Router
      # route types tsc needs don't exist until typegen writes them (see AGENTS.md). Biome already checked web/ in the
      # lint-format job. web:lint is a root package.json script, so this step switches from the job's default working
      # directory (web) back to the checkout root.
      - name: Typecheck
        working-directory: ${{ github.workspace }}
        run: pnpm run web:lint
      # Without this check, a schema edit with no matching migration goes unnoticed. The TypeScript types come straight
      # from schema.ts, so tsc stays green while the database drifts, and the mistake only shows up as a runtime SQL
      # error. db:generate does nothing when the schema matches the snapshot in web/drizzle/meta/, so any new file here
      # means the migration was never generated. drizzle-kit also exits 0 when it fails. For a rename it asks "created
      # or renamed?", and with no terminal to answer it prints an Error line and writes nothing, which a file check
      # alone would read as up to date.
      - name: Check migrations are up to date with the schema
        run: |
          pnpm db:generate 2>&1 | tee "$RUNNER_TEMP/db-generate.log"
          if grep -q '^Error' "$RUNNER_TEMP/db-generate.log"; then
            echo "::error::pnpm db:generate failed. A rename needs 'pnpm db:generate' run in an interactive terminal to answer its prompt."
            exit 1
          fi
          # --porcelain, not `git diff`: a new migration arrives as untracked files, which git diff does not report.
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::web/lib/server/db/schema.ts changed without a migration. Run 'pnpm db:generate' and commit web/drizzle/."
            git status --porcelain -- drizzle
            exit 1
          fi
      # Builds and runs the real migration image (web/Dockerfile's `migrator` stage) against this job's Postgres, rather
      # than only testing the web/scripts/db-migrate.cjs script underneath it. The Terraform tests in
      # infra/tests/web.tftest.hcl check that the task definition is wired correctly, but not that the image itself
      # applies a migration.
      - name: Build and run the migrator image against the CI database
        working-directory: web
        run: |
          podman build --target migrator -t migrator:ci .
          # Uses --network ci-net and reaches Postgres by container name. The "Start Postgres" step explains why
          # --network host isn't used. There is no DATABASE_SSL_CA: the migrator image doesn't turn TLS on by itself
          # (web/Dockerfile), and this database doesn't offer TLS. Only RDS's rds.force_ssl setting requires it.
          podman run --rm --network ci-net \
            -e DATABASE_HOST=ci-postgres -e DATABASE_PORT=5432 -e DATABASE_NAME=ai_gaussian_splatter \
            -e DATABASE_USER=postgres -e DATABASE_PASSWORD=postgres \
            migrator:ci
      # Applies the migrations again, directly rather than through the container. drizzle-kit records which migrations
      # have run, so after the step above this changes nothing. It is here to fail fast on a bad migration outside the
      # container path too. The server test project's globalSetup does the same once more, for the same reason.
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      # Skipped until web/e2e/ holds a spec, so the browser download isn't paid for zero tests. The first spec turns
      # both steps on.
      - name: Install Playwright browsers
        if: hashFiles('web/e2e/**') != ''
        run: npx playwright install --with-deps chromium
      - if: hashFiles('web/e2e/**') != ''
        run: pnpm test:e2e

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: terraform-version
        run: |
          source scripts/lib/terraform.sh
          version=$(tf_get_required_version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - run: pnpm run infra:lint
      # `terraform test`, the worker sweeper Lambda's unit tests, then the HCL scraper tests in
      # scripts/dev/terraform-test-lib.sh. No AWS credentials are configured here (this job runs on every pull_request,
      # including forks): `terraform test` runs entirely offline via mock_provider (infra/tests/*.tftest.hcl). The
      # Lambda tests are stdlib only, with boto3 stubbed, so the runner's own python3 runs them with nothing to install.
      - run: pnpm run infra:test

  # Records DEPLOY_ENABLED shortly after this run starts, once a runner picks this job up. The deploy job's if:
  # reads this output, not live vars when that job starts. Not a required check. It only runs on main, for a push or a
  # manual run.
  capture-deploy-enabled:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: echo "enabled=$DEPLOY_ENABLED" >> "$GITHUB_OUTPUT"

  # Runs .github/workflows/deploy.yml once every check job above has passed.
  deploy:
    needs: [lint-format, worker, web, infra, capture-deploy-enabled]
    # Deploying is off until the DEPLOY_ENABLED repository variable is set to true (RUNBOOK.md). An unset variable
    # renders as "", so a fresh fork or a torn-down account deploys nothing until someone turns it on deliberately.
    # The value is the one capture-deploy-enabled recorded shortly after this run started, not live vars now.
    if: >-
      needs.capture-deploy-enabled.outputs.enabled == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # Granted here rather than in .github/workflows/deploy.yml, because a called workflow can only narrow its caller's
    # permissions and this repo's default token is read-only.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml

