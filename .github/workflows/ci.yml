name: CI

# Plan §8: unit/component tests + the mocked-backend E2E test run on every
# PR here. Real-pipeline integration tests (COLMAP + gsplat on a real GPU)
# are deliberately NOT run here — they cost real time/money and stay
# manual/milestone-gated, per the plan's testing strategy.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Single Biome invocation from repo root covers both scripts/*.js
      # and web/ in one pass — Biome doesn't need web's own
      # node_modules to lint/format files, only its own binary.
      - run: pnpm biome:ci

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy pipeline
      # No GPU/CUDA toolkit in CI runners — this is exactly the CI-cheap
      # tier (fetch/export/status callbacks, mocked S3/HTTP), not the real
      # COLMAP+gsplat pipeline. See worker/pipeline/train.py's docstring.
      - run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    # The database-backed tests need a real database — the ON CONFLICT upserts
    # can't be faithfully faked.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web
    env:
      # Structurally valid dummy key (base64 of "example.clerk.accounts.dev$").
      # It has to parse — clerkMiddleware() rejects a malformed one outright.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_fake_for_ci
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: test
      DATABASE_USER: test
      DATABASE_PASSWORD: test
      # getEnv() validates all of these on first use, and getDb() calls it —
      # so any DB-touching page throws without them, including under the dev
      # server Playwright starts. Dummy values: presigning is local crypto and
      # nothing in CI reaches AWS.
      UPLOADS_BUCKET: test-uploads
      SPLATS_BUCKET: test-splats
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      WORKER_AMI_ID: ami-0123456789abcdef0
      WORKER_SUBNET_ID: subnet-0123456789abcdef0
      WORKER_SECURITY_GROUP_ID: sg-0123456789abcdef0
      WORKER_INSTANCE_PROFILE_ARN: arn:aws:iam::123456789012:instance-profile/worker
      APP_PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # pnpm typecheck runs `next typegen` before `tsc --noEmit` — required on
      # a clean checkout, since CI has never run `next dev`/`next build` to
      # generate the App Router route types tsc needs. See AGENTS.md.
      - run: pnpm typecheck
      # A schema edit with no matching migration is otherwise invisible: the
      # types come straight from schema.ts, so tsc stays green while the
      # database drifts, and it surfaces as a runtime SQL error. db:generate
      # is a no-op when the schema matches the snapshot in web/drizzle/meta/,
      # so anything new on disk here means the migration was never generated.
      - name: Check migrations are up to date with the schema
        run: |
          pnpm db:generate
          # --porcelain, not `git diff`: a new migration arrives as untracked
          # files, which git diff does not report.
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::web/lib/server/db/schema.ts changed without a migration. Run 'pnpm db:generate' and commit web/drizzle/."
            git status --porcelain -- drizzle
            exit 1
          fi
      # Applies migrations to the service container; the server test project's
      # globalSetup also does this, so this step mainly fails fast on a bad
      # migration before the suite starts.
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      # Python checks run first and need only uv — no Node/pnpm setup cost
      # if one of them fails. Node's only needed for the `cdk` CLI
      # (npm-distributed regardless of app language — there's no
      # pip-installable substitute), so it's set up last, right before the
      # one step that actually needs it.
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app.py stacks
      - run: uv run pytest -v
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # AWS_ACCOUNT_ID is deliberately left unset here: app.py falls
      # back to the placeholder account, and this job has no AWS
      # credentials configured (it runs on every pull_request, including
      # forks) — validates templates only, never a real deploy.
      - name: cdk synth
        run: pnpm synth
