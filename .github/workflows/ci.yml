name: CI

# Unit and component tests run on every PR here. Playwright runs too, but there are no specs yet, so
# `--pass-with-no-tests` keeps it green until a seeded test database exists (AGENTS.md). Tests that run the real
# pipeline (COLMAP and gsplat on a real GPU) are deliberately not run here. They cost real time and money, so they stay
# manual.
on:
  pull_request:
  push:
    branches: [main]
    # A push to main whose commits touch only docs skips the whole workflow, including the deploy. The PR checks already
    # validated those commits, so running lint, build, and deploy again would be wasted work.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # One Biome run from the repo root covers both scripts/*.js and web/. Biome needs only its own binary to lint and
      # format files, not web/'s node_modules.
      - run: pnpm biome:ci
      # Runs shellcheck, which Biome doesn't cover. scripts:check also runs Biome over scripts/, which repeats part of
      # what biome:ci already checked.
      - run: pnpm run scripts:check

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - working-directory: worker
        run: uv sync --group dev
      # worker:check (root package.json) is pure shell (`uv --directory worker run ...`). No worker node_modules to
      # install, just the pnpm CLI above to parse and run the script.
      - run: pnpm run worker:check
      - working-directory: worker
        # CI runners have no GPU or CUDA toolkit. These are the cheap tests (fetch, export, and status callbacks against
        # mocked S3 and HTTP), not the real COLMAP and gsplat pipeline.
        run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # A dummy key that is still structurally valid (the base64 of "example.clerk.accounts.dev$"). It has to parse,
      # because clerkMiddleware() rejects a malformed key outright.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_fake_for_ci
      # A pk_test_* key makes the Clerk SDK treat this as a development instance. The SDK hides its telemetry notice in
      # CI but still sends the telemetry, so without this variable CI runs report it.
      NEXT_PUBLIC_CLERK_TELEMETRY_DISABLED: "1"
      # These are inlined at build time, so `next build` here needs the same values a real image ships with. Without
      # them the built bundle sends users to Clerk's hosted Account Portal instead of the app's own sign-in page.
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /splats
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /splats
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      # getEnv() validates all of these on first use, and getDb() calls getEnv(). Any page that touches the database
      # therefore throws without them, including under the dev server Playwright starts. The values are dummies:
      # presigning is local crypto, and nothing in CI reaches AWS.
      UPLOADS_BUCKET: test-uploads
      SPLATS_BUCKET: test-splats
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      WORKER_AMI_ID: ami-0123456789abcdef0
      WORKER_SUBNET_ID: subnet-0123456789abcdef0
      WORKER_SECURITY_GROUP_ID: sg-0123456789abcdef0
      WORKER_INSTANCE_PROFILE_ARN: arn:aws:iam::123456789012:instance-profile/worker
      APP_PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      # Postgres starts with a plain `podman run` rather than a `services:` block. The migrator-image test below runs
      # its own podman container, which has to reach Postgres by container name. A GitHub Actions `services:` container
      # is managed by Docker, so a sibling podman container can't reach it that way. A dedicated podman network solves
      # that. `--network host` isn't used because it doesn't behave as true host networking under rootless podman on
      # this runner.
      - name: Start Postgres
        run: |
          podman network create ci-net
          podman run -d --name ci-postgres --network ci-net -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=test \
            postgres:18
          for _ in $(seq 1 30); do
            podman exec ci-postgres pg_isready -U postgres && break
            sleep 1
          done
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # web:check runs `next typegen` before `tsc --noEmit`. CI never runs `next dev` or `next build`, so the App Router
      # route types tsc needs don't exist until typegen writes them (see AGENTS.md). web:check is a root package.json
      # script, so this step switches from the job's default working directory (web) back to the checkout root. The
      # script itself passes `--dir web` to everything it runs, including its first step, `biome lint .`.
      - name: Check (lint + typecheck)
        working-directory: ${{ github.workspace }}
        run: pnpm run web:check
      # Without this check, a schema edit with no matching migration goes unnoticed. The TypeScript types come straight
      # from schema.ts, so tsc stays green while the database drifts, and the mistake only shows up as a runtime SQL
      # error. db:generate does nothing when the schema matches the snapshot in web/drizzle/meta/, so any new file here
      # means the migration was never generated. drizzle-kit also exits 0 when it fails. For a rename it asks "created
      # or renamed?", and with no terminal to answer it prints an Error line and writes nothing, which a file check
      # alone would read as up to date.
      - name: Check migrations are up to date with the schema
        run: |
          pnpm db:generate 2>&1 | tee "$RUNNER_TEMP/db-generate.log"
          if grep -q '^Error' "$RUNNER_TEMP/db-generate.log"; then
            echo "::error::pnpm db:generate failed. A rename needs 'pnpm db:generate' run in an interactive terminal to answer its prompt."
            exit 1
          fi
          # --porcelain, not `git diff`: a new migration arrives as untracked files, which git diff does not report.
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::web/lib/server/db/schema.ts changed without a migration. Run 'pnpm db:generate' and commit web/drizzle/."
            git status --porcelain -- drizzle
            exit 1
          fi
      # Builds and runs the real migration image (web/Dockerfile's `migrator` stage) against this job's Postgres, rather
      # than only testing the `drizzle-kit migrate` script underneath it. The Terraform tests in
      # infra/tests/web.tftest.hcl check that the task definition is wired correctly, but not that the image itself
      # applies a migration.
      - name: Build and run the migrator image against the CI database
        working-directory: web
        run: |
          podman build --target migrator -t migrator:ci .
          # Uses --network ci-net and reaches Postgres by container name. The "Start Postgres" step explains why
          # --network host isn't used. There is no DATABASE_SSL_CA: the migrator image doesn't turn TLS on by itself
          # (web/Dockerfile), and this database doesn't offer TLS. Only RDS's rds.force_ssl setting requires it.
          podman run --rm --network ci-net \
            -e DATABASE_HOST=ci-postgres -e DATABASE_PORT=5432 -e DATABASE_NAME=test \
            -e DATABASE_USER=postgres -e DATABASE_PASSWORD=postgres \
            migrator:ci
      # Applies the migrations again, directly rather than through the container. drizzle-kit records which migrations
      # have run, so after the step above this changes nothing. It is here to fail fast on a bad migration outside the
      # container path too. The server test project's globalSetup does the same once more, for the same reason.
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: terraform-version
        run: |
          source scripts/lib/terraform.sh
          version=$(tf_get_required_version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - run: pnpm run infra:check
      # No AWS credentials configured here (this job runs on every pull_request, including forks): `terraform test`
      # runs entirely offline via mock_provider (infra/tests/*.tftest.hcl).
      - name: terraform test
        working-directory: infra
        run: terraform test

  # Records DEPLOY_ENABLED shortly after this run starts, once a runner picks this job up. The deploy job's if:
  # reads this output, not live vars when that job starts. Not a required check. It only runs on push to main.
  capture-deploy-enabled:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: echo "enabled=$DEPLOY_ENABLED" >> "$GITHUB_OUTPUT"

  # Runs .github/workflows/deploy.yml once every check job above has passed.
  deploy:
    needs: [lint-format, worker, web, infra, capture-deploy-enabled]
    # Deploying is off until the DEPLOY_ENABLED repository variable is set to true (RUNBOOK.md). An unset variable
    # renders as "", so a fresh fork or a torn-down account deploys nothing until someone turns it on deliberately.
    # The value is the one capture-deploy-enabled recorded shortly after this run started, not live vars now.
    if: needs.capture-deploy-enabled.outputs.enabled == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Granted here rather than in .github/workflows/deploy.yml, because a called workflow can only narrow its caller's
    # permissions and this repo's default token is read-only.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml

