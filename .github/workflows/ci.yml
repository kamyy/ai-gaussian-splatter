name: CI

# Plan §8: unit/component tests + the mocked-backend E2E test run on every
# PR here. Real-pipeline integration tests (COLMAP + gsplat on a real GPU)
# are deliberately NOT run here — they cost real time/money and stay
# manual/milestone-gated, per the plan's testing strategy.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Run tests (unit tier always; Postgres-dependent tier via TEST_DATABASE_URL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
        run: uv run pytest -v

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy pipeline
      # No GPU/CUDA toolkit in CI runners — this is exactly the CI-cheap
      # tier (fetch/export/status callbacks, mocked S3/HTTP), not the real
      # COLMAP+gsplat pipeline. See worker/pipeline/train.py's docstring.
      - run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFrZS1rZXktZm9yLWNpJA
      CLERK_SECRET_KEY: sk_test_fake_for_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npx next build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npx playwright test

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      # Python checks run first and need only uv — no Node/pnpm setup cost
      # if one of them fails. Node's only needed for the `cdk` CLI
      # (npm-distributed regardless of app language — there's no
      # pip-installable substitute), so it's set up last, right before the
      # one step that actually needs it.
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app.py stacks
      - run: uv run pytest -v
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # AWS_ACCOUNT_ID is deliberately left unset here: app.py falls
      # back to the placeholder account, and this job has no AWS
      # credentials configured (it runs on every pull_request, including
      # forks) — validates templates only, never a real deploy.
      - name: cdk synth
        run: npx cdk synth
