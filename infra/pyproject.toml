[project]
name = "ai-gaussian-splatter-infra"
version = "1.0.0"
description = "AWS CDK app for AI Gaussian Splatter (plan §6, §9)"
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib==2.262.2", # exact-pinned (not a caret range) for deterministic synth output
    "constructs>=10.8,<11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["stacks"]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacks"]
